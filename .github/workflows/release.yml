name: Validate and Release

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Read package version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('system.json', 'utf8')).version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find scripts assets -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done

      - name: Validate manifest, templates, styles and regressions
        run: node tests/validate-package.mjs

      - name: Build Foundry package
        run: |
          zip -r nexus.zip system.json scripts templates styles assets lang README.md CHANGELOG.md
          unzip -t nexus.zip

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ steps.version.outputs.value }}
          path: nexus.zip
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish Foundry release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release]')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Download validated package
        uses: actions/download-artifact@v4
        with:
          name: nexus-${{ needs.validate.outputs.version }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: NEXUS ${{ needs.validate.outputs.version }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: nexus.zip
