name: Validate and Release

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
  workflow_dispatch:
    inputs:
      release_channel:
        description: "Ação manual: validar ou publicar uma versão candidata."
        required: true
        type: choice
        options:
          - validate
          - candidate
        default: validate
      candidate_version:
        description: "Versão candidata no formato 1.0.0.97-rc.1 (obrigatória para candidate)."
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      channel: ${{ steps.version.outputs.channel }}
      previous: ${{ steps.version.outputs.previous }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Resolve release channel and package version
        id: version
        env:
          RELEASE_CHANNEL_INPUT: ${{ inputs.release_channel }}
          CANDIDATE_VERSION_INPUT: ${{ inputs.candidate_version }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const system = JSON.parse(fs.readFileSync("system.json", "utf8"));
          const event = JSON.parse(fs.readFileSync(process.env.GITHUB_EVENT_PATH, "utf8"));
          const eventName = process.env.GITHUB_EVENT_NAME;
          const ref = process.env.GITHUB_REF;
          let channel = "validate";
          let version = system.version;

          const commitMessage = event.head_commit?.message ?? "";
          const stableMarker = /(?:^|\s)\[release\](?=$|\s)/m;
          const candidateMarker = /(?:^|\s)\[candidate\](?=$|\s)/m;
          if (eventName === "push" && ref === "refs/heads/main" && stableMarker.test(commitMessage)) {
            channel = "stable";
          }
          if (eventName === "push" && ref === "refs/heads/main" && candidateMarker.test(commitMessage)) {
            version = `${system.version}-rc.1`;
            channel = "candidate";
          }

          if (eventName === "workflow_dispatch" && process.env.RELEASE_CHANNEL_INPUT === "candidate") {
            if (ref !== "refs/heads/main") throw new Error("Versões candidatas só podem ser geradas a partir da main.");
            const candidate = process.env.CANDIDATE_VERSION_INPUT ?? "";
            if (!/^\d+\.\d+\.\d+\.\d+-rc\.[1-9]\d*$/.test(candidate)) {
              throw new Error("Versão candidata inválida. Use o formato 1.0.0.97-rc.1.");
            }
            const proposedBase = candidate.split("-")[0];
            const core = value => value.split(".").map(Number);
            const current = core(system.version);
            const proposed = core(proposedBase);
            const comparison = proposed.findIndex((part, index) => part !== current[index]);
            const sameBase = proposedBase === system.version;
            if (!sameBase && (comparison === -1 || proposed[comparison] <= current[comparison])) {
              throw new Error(`A candidata deve usar a versão base atual (${system.version}) ou avançar para uma versão superior.`);
            }
            version = candidate;
            channel = "candidate";
          }

          if (eventName === "workflow_dispatch" && process.env.RELEASE_CHANNEL_INPUT === "candidate" && channel !== "candidate") {
            throw new Error("Não foi possível habilitar o canal de candidata.");
          }

          fs.appendFileSync(process.env.GITHUB_OUTPUT, `value=${version}\nchannel=${channel}\nprevious=${system.version}\n`);
          console.log(`Canal: ${channel}; pacote: ${version}`);
          NODE

      - name: Validate manifest, templates, styles and regressions
        run: |
          node tests/run-all.mjs

      - name: Apply candidate version to package metadata
        if: steps.version.outputs.channel == 'candidate'
        env:
          RELEASE_VERSION: ${{ steps.version.outputs.value }}
          PREVIOUS_VERSION: ${{ steps.version.outputs.previous }}
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const version = process.env.RELEASE_VERSION;
          const previous = process.env.PREVIOUS_VERSION;
          const system = JSON.parse(fs.readFileSync("system.json", "utf8"));
          if (system.version !== previous) throw new Error("A versão base mudou durante o empacotamento.");
          const manifestUrl = "https://raw.githubusercontent.com/yottastrofficial-boop/Nexus/main/manifest-preview.json";
          const downloadUrl = `https://github.com/yottastrofficial-boop/Nexus/releases/download/v${version}/nexus.zip`;
          system.version = version;
          system.manifest = manifestUrl;
          system.download = downloadUrl;
          if (system.manifest !== manifestUrl || system.download !== downloadUrl) {
            throw new Error("Os endereços do manifesto candidato não foram sincronizados.");
          }
          fs.writeFileSync("system.json", JSON.stringify(system, null, 2) + "\n");

          const readme = fs.readFileSync("README.md", "utf8");
          const readmeVersion = `Versão ${previous}`;
          if (!readme.includes(readmeVersion)) throw new Error("A versão do README não corresponde à versão base.");
          fs.writeFileSync("README.md", readme.replace(readmeVersion, `Versão ${version}`));

          const changelog = fs.readFileSync("CHANGELOG.md", "utf8");
          if (!changelog.startsWith(`## ${previous}`)) throw new Error("O CHANGELOG não começa pela versão base esperada.");
          const notes = `## ${version} — Release candidata\n\n- Build candidata gerada a partir da main para validação no Foundry VTT 14 build 360.\n- Inclui as alterações integradas após a última release estável.\n- Esta candidata não altera o manifesto estável do Foundry.\n\n`;
          fs.writeFileSync("CHANGELOG.md", notes + changelog);
          NODE

      - name: Build Foundry package
        run: |
          zip -r nexus.zip system.json scripts templates styles assets lang README.md CHANGELOG.md
          unzip -t nexus.zip

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ steps.version.outputs.value }}
          path: nexus.zip
          if-no-files-found: error
          retention-days: 14

  release:
    # Estável: push na main com [release] exato. Candidata: dispatch manual a partir da main.
    if: needs.validate.outputs.channel == 'stable' || needs.validate.outputs.channel == 'candidate'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write # tag, GitHub Release and synchronized stable metadata
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download validated package
        uses: actions/download-artifact@v4
        with:
          name: nexus-${{ needs.validate.outputs.version }}

      - name: Check existing release
        id: release_state
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: v${{ needs.validate.outputs.version }}
        run: |
          if TAG_REF=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" 2>/dev/null); then
            TAG_TYPE=$(printf '%s' "$TAG_REF" | jq -r '.object.type')
            TAG_OBJECT_SHA=$(printf '%s' "$TAG_REF" | jq -r '.object.sha')
            if [ "$TAG_TYPE" = "tag" ]; then
              TARGET_SHA=$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAG_OBJECT_SHA}" --jq '.object.sha')
            else
              TARGET_SHA="$TAG_OBJECT_SHA"
            fi
            if [ "$TARGET_SHA" != "$GITHUB_SHA" ]; then
              echo "::error::Tag ${RELEASE_TAG} already points to another commit."
              exit 1
            fi
            RELEASE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" 2>/dev/null) || {
              echo "::error::Tag ${RELEASE_TAG} exists but its GitHub Release is missing."
              exit 1
            }
            ASSET_STATE=$(printf '%s' "$RELEASE" | jq -r '[.assets[] | select(.name == "nexus.zip") | .state][0] // ""')
            if [ "$ASSET_STATE" != "uploaded" ]; then
              echo "::error::Release ${RELEASE_TAG} exists without a verified nexus.zip asset."
              exit 1
            fi
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Existing release matches this commit and has a verified package; continuing idempotently."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish GitHub Release
        if: steps.release_state.outputs.exists != 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: NEXUS ${{ needs.validate.outputs.version }}${{ needs.validate.outputs.channel == 'candidate' && ' (candidato)' || '' }}
          generate_release_notes: true
          prerelease: ${{ needs.validate.outputs.channel == 'candidate' }}
          make_latest: ${{ needs.validate.outputs.channel == 'stable' && 'true' || 'false' }}
          fail_on_unmatched_files: true
          overwrite_files: false
          files: nexus.zip

      - name: Verify published package asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for attempt in {1..10}; do
            STATE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${RELEASE_VERSION}" --jq '.assets[] | select(.name == "nexus.zip") | .state' || true)
            if [ "$STATE" = "uploaded" ]; then
              echo "nexus.zip is uploaded and available for v${RELEASE_VERSION}."
              exit 0
            fi
            sleep 2
          done
          echo "::error::The release asset nexus.zip was not confirmed as uploaded."
          exit 1

      - name: Publish candidate Foundry manifest after the package is available
        if: needs.validate.outputs.channel == 'candidate'
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        with:
          script: |
            const version = process.env.RELEASE_VERSION;
            const manifestUrl = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/manifest-preview.json`;
            const downloadUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/v${version}/nexus.zip`;
            const metadata = JSON.parse(require("node:fs").readFileSync("system.json", "utf8"));
            metadata.version = version;
            metadata.manifest = manifestUrl;
            metadata.download = downloadUrl;
            const content = JSON.stringify(metadata, null, 2) + "\n";
            let sha;
            try {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner, repo: context.repo.repo,
                path: "manifest-preview.json", ref: "main"
              });
              const currentText = Buffer.from(current.data.content, "base64").toString("utf8");
              if (currentText === content) {
                core.info("Candidate manifest already matches the verified release.");
                return;
              }
              sha = current.data.sha;
            } catch (error) {
              if (error.status !== 404) throw error;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner, repo: context.repo.repo,
              path: "manifest-preview.json",
              message: `[manifest] Publica manifesto de teste NEXUS ${version}`,
              content: Buffer.from(content, "utf8").toString("base64"),
              ...(sha ? { sha } : {}),
              branch: "main"
            });
            core.info(`Candidate manifest synchronized to NEXUS ${version}.`);

      - name: Publish stable Foundry manifest after the package is available
        if: needs.validate.outputs.channel == 'stable'
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        with:
          script: |
            const fs = require("node:fs");
            const version = process.env.RELEASE_VERSION;
            const manifestUrl = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/manifest.json`;
            const downloadUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/v${version}/nexus.zip`;
            const packageMetadata = JSON.parse(fs.readFileSync("system.json", "utf8"));
            if (packageMetadata.version !== version) {
              throw new Error(`Manifest version mismatch: expected ${version}, received ${packageMetadata.version}`);
            }

            const updateTextFile = async (path, content, message) => {
              const current = await github.rest.repos.getContent({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                ref: "main"
              });
              const currentText = Buffer.from(current.data.content, "base64").toString("utf8");
              if (currentText === content) {
                core.info(`${path} already matches the published release.`);
                return;
              }
              await github.rest.repos.createOrUpdateFileContents({
                owner: context.repo.owner,
                repo: context.repo.repo,
                path,
                message,
                content: Buffer.from(content, "utf8").toString("base64"),
                sha: current.data.sha,
                branch: "main"
              });
              core.info(`${path} synchronized to NEXUS ${version}.`);
            };

            const manifestContent = JSON.stringify({
              ...packageMetadata,
              manifest: manifestUrl,
              download: downloadUrl
            }, null, 2) + "\n";
            await updateTextFile("manifest.json", manifestContent, `[manifest] Publica NEXUS ${version} após confirmar o pacote`);

            const systemCurrent = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "system.json",
              ref: "main"
            });
            const systemMetadata = JSON.parse(Buffer.from(systemCurrent.data.content, "base64").toString("utf8"));
            if (systemMetadata.version !== version) {
              throw new Error(`system.json version mismatch: expected ${version}, received ${systemMetadata.version}`);
            }
            systemMetadata.manifest = manifestUrl;
            systemMetadata.download = downloadUrl;
            await updateTextFile("system.json", JSON.stringify(systemMetadata, null, 2) + "\n",
              `[system] Sincroniza download do NEXUS ${version}`);
