name: Validate and Release

on:
  pull_request:
  push:
    branches:
      - main
      - "fix/**"
      - "feature/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    name: Validate package
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Read package version
        id: version
        shell: bash
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('system.json', 'utf8')).version")
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check JavaScript syntax
        shell: bash
        run: |
          find scripts assets -type f -name '*.js' -print0 | while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --input-type=module --check < "$file"
          done

      - name: Validate manifest, templates, styles and regressions
        run: |
          node --experimental-default-type=module tests/media-format-registry.mjs
          node --experimental-default-type=module tests/logic-infrastructure.mjs
          node --experimental-default-type=module tests/media-infrastructure.mjs
          node --experimental-default-type=module tests/core-regressions.mjs
          node tests/validate-package.mjs
          node --experimental-default-type=module tests/docs-consistency.mjs
          node --experimental-default-type=module tests/group-render-performance.mjs
          node --experimental-default-type=module tests/resource-lifecycle.test.mjs
          node --experimental-default-type=module tests/foundry-document-bridge.test.mjs

      - name: Build Foundry package
        run: |
          zip -r nexus.zip system.json scripts templates styles assets lang README.md CHANGELOG.md
          unzip -t nexus.zip

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexus-${{ steps.version.outputs.value }}
          path: nexus.zip
          if-no-files-found: error
          retention-days: 14

  release:
    # Execução manual valida e empacota; publicação exige push explícito com [release] na main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[release')
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download validated package
        uses: actions/download-artifact@v4
        with:
          name: nexus-${{ needs.validate.outputs.version }}

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ needs.validate.outputs.version }}
          name: NEXUS ${{ needs.validate.outputs.version }}
          generate_release_notes: true
          make_latest: true
          fail_on_unmatched_files: true
          overwrite_files: true
          files: nexus.zip

      - name: Verify published package asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        run: |
          for attempt in {1..10}; do
            STATE=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/v${RELEASE_VERSION}" --jq '.assets[] | select(.name == "nexus.zip") | .state' || true)
            if [ "$STATE" = "uploaded" ]; then
              echo "nexus.zip is uploaded and available for v${RELEASE_VERSION}."
              exit 0
            fi
            sleep 2
          done
          echo "::error::The release asset nexus.zip was not confirmed as uploaded."
          exit 1

      - name: Publish stable Foundry manifest after the package is available
        uses: actions/github-script@v7
        env:
          RELEASE_VERSION: ${{ needs.validate.outputs.version }}
        with:
          script: |
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("system.json", "utf8"));
            const version = process.env.RELEASE_VERSION;
            if (manifest.version !== version) {
              throw new Error(`Manifest version mismatch: expected ${version}, received ${manifest.version}`);
            }
            manifest.manifest = `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/main/manifest.json`;
            manifest.download = `https://github.com/${context.repo.owner}/${context.repo.repo}/releases/download/v${version}/nexus.zip`;
            const content = JSON.stringify(manifest, null, 2) + "\n";
            const current = await github.rest.repos.getContent({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "manifest.json",
              ref: "main"
            });
            const currentText = Buffer.from(current.data.content, "base64").toString("utf8");
            if (currentText === content) {
              core.info("Stable manifest already matches the published release.");
              return;
            }
            await github.rest.repos.createOrUpdateFileContents({
              owner: context.repo.owner,
              repo: context.repo.repo,
              path: "manifest.json",
              message: `[manifest] Publica NEXUS ${version} após confirmar o pacote`,
              content: Buffer.from(content, "utf8").toString("base64"),
              sha: current.data.sha,
              branch: "main"
            });
            core.info(`Stable manifest updated to NEXUS ${version} after asset upload.`);
