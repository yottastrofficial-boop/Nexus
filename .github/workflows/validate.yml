name: Validate NEXUS

on:
  pull_request:
  push:
    branches:
      - main
      - "refactor/**"

permissions:
  contents: read

jobs:
  package-validation:
    name: Package and regression validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate package and regressions
        run: |
          node --experimental-default-type=module tests/design-system.test.mjs
          node --experimental-default-type=module tests/media-format-registry.mjs
          node --experimental-default-type=module tests/logic-infrastructure.mjs
          node --experimental-default-type=module tests/logic-schemas.test.mjs
          node --experimental-default-type=module tests/logic-editors.test.mjs
          node --experimental-default-type=module tests/foundry-logic-integration.test.mjs
          node --experimental-default-type=module tests/media-infrastructure.mjs
          node --experimental-default-type=module tests/core-regressions.mjs
          node --experimental-default-type=module tests/validate-package.mjs
          node --experimental-default-type=module tests/docs-consistency.mjs
          node --experimental-default-type=module tests/group-render-performance.mjs
